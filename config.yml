# Allgemein
schema: 2
language: "german"
prefix: "§bMLG§fRUSH"
chat-format: "§b✦ {prefix} §8- §7{message}"
error-format: "§b✦ {prefix} §8- §c{message}"
menu-title: "MLGRUUSH"
language-menu-title: "Sprache / Language"
language-button-de: Deutsch
language-button-en: English

# Duell und Training
bed-points-to-win: 5
practice-ringouts: 3
practice-enabled: true
op-sword-practice: true
invite-seconds: 60
countdown-seconds: 5
respawn-protection-ms: 500
practice-leave-hint: " §7· /rush leave"
duel-map-announcement: "Map · "

# Kampf und Spielregeln
hearts: 3
hit-damage: 2
hit-cooldown-ms: 420
kill-credit-seconds: 8
knockback-base: 0.38
knockback-per-level: 0.32
knockback-vertical: 0.42
knockback-enchantment: 3
arena-pvp: true
arena-fall-damage: true
natural-healing: false
arena-mine-terrain: true
block-non-op-drops: true
protect-kit-drops: true
protect-lobby-drops: true

# Kit und Hotbar
kit-default-slots: [1, 2, 3]
kit-block-count: 64
refill-blocks: true
kit-food: 20
freeze-hunger: true
kit-stick: "minecraft:stick"
kit-pickaxe: "minecraft:diamond_pickaxe"
kit-block-red: "minecraft:red_wool"
kit-block-blue: "minecraft:blue_wool"
editor-save-item: "minecraft:emerald"
editor-empty-slot: "minecraft:light_gray_stained_glass_pane"
editor-selected-format: "§b{slot} · {item}"
editor-slot-format: "§f{slot} · {item}"

# Lobby
fallback-lobby-world: world
lobby-xp-level: 2026
lobby-radius: 32
lobby-protect-build: true
lobby-protect-damage: true
lobby-slots: [1, 5, 9, 7]
lobby-sword: "minecraft:iron_sword"
lobby-editor: "minecraft:chest"
lobby-practice: "minecraft:compass"
lobby-language: "minecraft:book"

# Anzeige und Scoreboard
lobby-hide-hud: [HEALTH, HUNGER, ARMOR, AIR_BUBBLES, HORSE_HEALTH]
kit-hide-hud: [HEALTH, HUNGER, ARMOR, AIR_BUBBLES, HORSE_HEALTH]
scoreboard-title: "§bMLG§fRUSH"
duel-scoreboard: true
practice-scoreboard: true
duel-lines-de: ["§7Bettpunkte", "  §cRot     §f{red}", "  §9Blau    §f{blue}", "§r ", "§7Deine Runde", "  §7Kills    §7{kills}", "  §7Tode    §7{deaths}", "{hearts}"]
practice-lines-de: ["§bTraining", "§7Betten  {beds}", "§7Tode    {deaths}", "{hearts}"]
duel-lines-en: ["§7Bed points", "  §cRed     §f{red}", "  §9Blue    §f{blue}", "§r ", "§7Your round", "  §7Kills    §7{kills}", "  §7Deaths  §7{deaths}", "{hearts}"]
practice-lines-en: ["§bPractice", "§7Beds  {beds}", "§7Deaths  {deaths}", "{hearts}"]
hearts-format: "  §c{full}§8{empty}"
heart-symbol: "♥ "

# Karten und Weltregeln
arena-center-x: 80
arena-floor-y: 80
arena-center-z: 80
bed-color-red: RED
bed-color-blue: BLUE
arena-allow-mobs: false
fixed-time: true
world-time: 6000
copy-when-full: true
shuffle-map-order: true
default-world: "MLG_Rush_Map"
default-map-title: "MLG Rush Map"
palette-red_concrete: "minecraft:red_concrete"
palette-blue_concrete: "minecraft:blue_concrete"
palette-smooth_quartz: "minecraft:smooth_quartz"
palette-smooth_stone: "minecraft:smooth_stone"
palette-red_terracotta: "minecraft:red_terracotta"
palette-blue_terracotta: "minecraft:blue_terracotta"
palette-sea_lantern: "minecraft:sea_lantern"

